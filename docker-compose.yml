# EnvSense full stack:  docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: envsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-envsense}
      POSTGRES_DB: envsense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envsense -d envsense"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://envsense:${POSTGRES_PASSWORD:-envsense}@db:5432/envsense
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fake sensor fleet: POSTs readings to the API every second (replace with real hardware).
  simulator:
    build: ./api
    restart: unless-stopped
    command: ["node", "dist/simulate.js"]
    environment:
      API_URL: http://api:3001
      INTERVAL_MS: "1000"
    depends_on:
      api:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
