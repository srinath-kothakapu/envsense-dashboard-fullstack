name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    name: API (typecheck, test against Postgres, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: envsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/envsense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (build images, run the stack, smoke test)
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through the nginx proxy
        run: |
          curl -fsS http://localhost:8080/api/health
          echo
          n=0
          for i in $(seq 1 30); do
            n=$(curl -fsS "http://localhost:8080/api/readings?limit=1" | jq '.readings | length')
            [ "$n" -ge 1 ] && break
            sleep 1
          done
          echo "readings visible through proxy: $n"
          [ "$n" -ge 1 ]
          curl -fsS http://localhost:8080/ | grep -q "EnvSense"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
